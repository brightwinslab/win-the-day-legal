<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Confirmation | Win the Day</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f6ff;
      color: #263238;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    main {
      max-width: 480px;
      background: white;
      padding: 36px 28px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    .check {
      width: 68px;
      height: 68px;
      line-height: 68px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #e1f5e8;
      color: #187744;
      font-size: 38px;
      font-weight: bold;
    }
    h1 { color: #3157a4; }
    p { line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      background: #3157a4;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>Thanks for confirming!</h1>
    <p>Your email confirmation link has brought you to Win the Day.</p>
    <p>Return to the app to sign in and continue managing your family's daily chart, goals, and privileges.</p>
    <a href="/">Return to Win the Day</a>
    <p><small>If the app does not open, return to the browser or device where you use Win the Day.</small></p>
  </main>
</body>
</html>
