<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6fb8"/><stop offset="1" stop-color="#2d5aa3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/><stop offset=".55" stop-color="#f7b928"/><stop offset="1" stop-color="#d98d0b"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9a51a"/><stop offset="1" stop-color="#b8740a"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4b1c"/><stop offset="1" stop-color="#5e2f0e"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0a1e50" flood-opacity=".22"/>
    </filter>
    <filter id="outline" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feComponentTransfer result="d"><feFuncA type="linear" slope="40" intercept="-1.2"/></feComponentTransfer>
      <feFlood flood-color="#fff"/><feComposite in2="d" operator="in" result="w"/>
      <feDropShadow in="w" dx="0" dy="6" stdDeviation="8" flood-color="#0a1e50" flood-opacity=".22" result="ws"/>
      <feMerge><feMergeNode in="ws"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- checklist board -->
  <g filter="url(#sh)">
    <rect x="125" y="73" width="264" height="344" rx="40" fill="#fff"/>
    <rect x="146" y="94" width="222" height="302" rx="24" fill="url(#doc)"/>
  </g>
  <!-- rows -->
  <g>
    <rect x="172" y="146" width="172" height="52" rx="16" fill="#e6f7ec"/>
    <circle cx="199" cy="172" r="15" fill="#2fb36b"/>
    <path d="M191 172 l6 6 l11 -12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="224" y="166" width="100" height="12" rx="6" fill="#9be0b4"/>

    <rect x="172" y="214" width="172" height="52" rx="16" fill="#e6f7ec"/>
    <circle cx="199" cy="240" r="15" fill="#2fb36b"/>
    <path d="M191 240 l6 6 l11 -12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="224" y="234" width="100" height="12" rx="6" fill="#9be0b4"/>

    <rect x="172" y="282" width="172" height="52" rx="16" fill="#ffffff" fill-opacity=".22"/>
    <circle cx="199" cy="308" r="14" fill="none" stroke="#fff" stroke-width="4"/>
    <rect x="224" y="302" width="100" height="12" rx="6" fill="#fff" fill-opacity=".85"/>
  </g>

  <!-- star badge -->
  <g filter="url(#sh)">
    <circle cx="372" cy="98" r="53" fill="#fff"/>
    <circle cx="372" cy="98" r="38" fill="url(#gold)"/>
    <path d="M372 74 l7.6 15.4 17 2.5 -12.3 12 2.9 16.9 -15.2 -8 -15.2 8 2.9 -16.9 -12.3 -12 17 -2.5z" fill="#5a3b00"/>
  </g>

  <!-- trophy -->
  <g filter="url(#outline)" transform="translate(52 280)">
    <!-- handles -->
    <path d="M38 24 c-34 0 -34 52 6 56" fill="none" stroke="url(#goldDark)" stroke-width="11" stroke-linecap="round"/>
    <path d="M142 24 c34 0 34 52 -6 56" fill="none" stroke="url(#goldDark)" stroke-width="11" stroke-linecap="round"/>
    <!-- cup -->
    <path d="M30 10 h120 c0 62 -26 96 -60 96 c-34 0 -60 -34 -60 -96z" fill="url(#gold)"/>
    <path d="M44 22 c2 34 12 58 30 70" fill="none" stroke="#fff6cc" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    <ellipse cx="90" cy="12" rx="60" ry="9" fill="#ffe9a0"/>
    <!-- stem + base -->
    <path d="M80 104 h20 l6 26 h-32z" fill="url(#goldDark)"/>
    <rect x="58" y="128" width="64" height="14" rx="5" fill="url(#gold)"/>
    <rect x="48" y="140" width="84" height="22" rx="6" fill="url(#base)"/>
    <rect x="72" y="146" width="36" height="9" rx="3" fill="#f7b928"/>
  </g>
</svg>
